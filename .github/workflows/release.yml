name: release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Managed Apple-silicon release, or the historical root-only recipe"
        required: true
        default: managed-apple-silicon
        type: choice
        options:
          - managed-apple-silicon
          - legacy-root-only
      payload_sha256:
        description: "SHA-256 of blackcrab-managed-payloads.zip on the draft release (managed mode)"
        required: false
        type: string
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build and publish (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.kind == 'managed-apple-silicon' && '[{"platform":"macos-15","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin","managed":true}]' || '[{"platform":"macos-latest","args":"--target universal-apple-darwin","rust-targets":"aarch64-apple-darwin x86_64-apple-darwin","managed":false},{"platform":"ubuntu-22.04","args":"","rust-targets":"","managed":false},{"platform":"windows-latest","args":"","rust-targets":"","managed":false}]') }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to build updater artifacts."
            echo "Generate it with: npm run tauri -- signer generate --write-keys ~/.tauri/blackcrab-updater.key"
            exit 1
          fi

      - name: Validate Apple signing and notarization secrets
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0

          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is required for signed and notarized macOS releases."
              missing=1
            fi
          }

          require_secret "APPLE_CERTIFICATE" "$APPLE_CERTIFICATE"
          require_secret "APPLE_CERTIFICATE_PASSWORD" "$APPLE_CERTIFICATE_PASSWORD"
          require_secret "APPLE_SIGNING_IDENTITY" "$APPLE_SIGNING_IDENTITY"
          require_secret "APPLE_TEAM_ID" "$APPLE_TEAM_ID"

          has_apple_id_auth=0
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            has_apple_id_auth=1
          fi

          has_api_key_auth=0
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            has_api_key_auth=1
          fi

          if [ "$has_apple_id_auth" -eq 0 ] && [ "$has_api_key_auth" -eq 0 ]; then
            echo "::error::Configure notarization with either APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID or APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Write App Store Connect API key
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            exit 0
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Validate App Store Connect API key
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${APPLE_API_KEY_PATH:-}" ]; then
            exit 0
          fi

          xcrun notarytool history \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            >/dev/null

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: "26.12.1"
          cache: npm

      - name: Check locked Tauri npm and Rust compatibility
        run: node scripts/check-tauri-versions.mjs

      - name: Download and verify accepted managed payloads
        if: matrix.managed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$PAYLOAD_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]
          input_dir="$RUNNER_TEMP/blackcrab-release-inputs"
          mkdir "$input_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern blackcrab-managed-payloads.zip --dir "$input_dir"
          node scripts/macos-release/release-inputs.mjs --mode unpack \
            --archive "$input_dir/blackcrab-managed-payloads.zip" --sha "$PAYLOAD_SHA256" \
            --output "$input_dir/payloads" --tag "$RELEASE_TAG"
          payloads="$(cd "$input_dir/payloads" && pwd -P)"
          echo "BLACKCRAB_RELEASE_PAYLOADS_DIR=$payloads" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        if: matrix.rust-targets != ''
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - name: Prepare macOS signing keychain
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/blackcrab-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild \
            >/dev/null

          while IFS= read -r identity; do
            if [[ "$identity" =~ ^[[:space:]]*[0-9]+\)\ ([A-F0-9]+)\ \"(.+)\"$ ]]; then
              certificate_hash="${BASH_REMATCH[1]}"
              certificate_name="${BASH_REMATCH[2]}"
              if [[ "$certificate_name" != "$APPLE_SIGNING_IDENTITY" ]]; then
                security delete-identity -Z "$certificate_hash" "$keychain_path" >/dev/null
              fi
            fi
          done < <(security find-identity -v -p codesigning "$keychain_path")

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::APPLE_CERTIFICATE does not contain $APPLE_SIGNING_IDENTITY."
            exit 1
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/^ *"//;s/"$//')
          security default-keychain -d user -s "$keychain_path"

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Blackcrab ${{ inputs.tag }}"
          releaseBody: "See the attached installers and updater artifacts."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          tauriScript: ${{ matrix.managed && 'node scripts/macos-release/tauri-cli.mjs' || '' }}

      - name: Check Apple-silicon updater metadata
        if: matrix.managed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/blackcrab-updater-metadata"
          mkdir "$metadata_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$metadata_dir"
          node scripts/macos-release/verify-update-manifest.mjs "$metadata_dir/latest.json" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Blackcrab.app.tar.gz.sig "$RELEASE_TAG"

      - name: Notarize and re-upload macOS DMGs
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmgs=()
          while IFS= read -r -d '' dmg; do
            dmgs+=("$dmg")
          done < <(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print0)

          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::No DMG artifacts found to notarize."
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
              xcrun notarytool submit "$dmg" \
                --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" \
                --wait
            else
              xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
            fi

            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"

            gh release upload "$RELEASE_TAG" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"
          done

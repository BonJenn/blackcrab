name: managed runtime

on:
  pull_request:
    paths:
      - managed-desktop/targets.mjs
      - managed-desktop/runtime-package.mjs
      - managed-desktop/runtime-package.test.mjs
      - managed-desktop/targets.test.mjs
      - managed-desktop/artifact*.mjs
      - managed-desktop/portable-artifact.test.mjs
      - managed-desktop/testing/**
      - managed-desktop/patches/**
      - managed-desktop/assets/**
      - scripts/verify-managed-runtime.mjs
      - .github/workflows/managed-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: native Electron (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libgtk-3-dev libnss3 libasound2t64
      - name: Test staging rejection boundaries
        run: node --test managed-desktop/runtime-package.test.mjs managed-desktop/targets.test.mjs managed-desktop/portable-artifact.test.mjs
      - name: Stage and execute the exact runtime in an isolated profile
        run: node scripts/verify-managed-runtime.mjs --report "${{ runner.temp }}/managed-runtime-result.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: managed-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/managed-runtime-result.json
          if-no-files-found: warn

name: managed Linux host

on:
  pull_request:
    paths:
      - managed-host/**
      - managed-cloud/client-config.mjs
      - src-tauri/src/managed_host.rs
      - src-tauri/src/managed_service*.rs
      - src-tauri/src/managed_payload.rs
      - scripts/prepare-service-issuer*
      - scripts/managed-native-resources*
      - scripts/build-linux-host-ci.mjs
      - scripts/test-linux-service-manager.py
      - .github/workflows/managed-linux-host.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-linux-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-package:
    name: actual Linux host and systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: npm ci --ignore-scripts
      - run: npm install --global pnpm@12.14.0 --ignore-scripts
      - name: Build real pinned host, archive and native helper
        run: node scripts/build-linux-host-ci.mjs --root "${{ runner.temp }}/linux-host-build" --pnpm "$(command -v pnpm)"
      - name: Exercise actual package through isolated systemd and native attachment
        run: python3 scripts/test-linux-service-manager.py --actual-host
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-host-package-build
          path: |
            ${{ runner.temp }}/linux-host-build/result.json
            ${{ runner.temp }}/linux-host-build/cache/blackcrab-managed-build-*/*.log
          if-no-files-found: warn

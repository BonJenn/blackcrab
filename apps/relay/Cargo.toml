[package]
name = "blackcrab-relay"
version = "0.1.0"
description = "End-to-end-encrypted relay for the Blackcrab mobile companion. Routes opaque ciphertext frames between a desktop host and its paired phones; never sees keys or plaintext."
authors = ["Jonathan Benn"]
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "blackcrab-relay"
path = "src/main.rs"

[lib]
name = "blackcrab_relay"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"

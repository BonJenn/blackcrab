name: ci

on:
  pull_request:
  push:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (tsc + test + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26.12.1"
          cache: npm

      - run: npm install --global npm@12.2.2

      - run: npm ci

      - run: npm run typecheck

      - run: npm run typecheck --workspaces --if-present

      - run: npm test

      - run: npm test --workspaces --if-present

      - run: npm run test:managed-host

      - run: node --test fork-integration/identity/*.test.mjs fork-integration/owner-control/*.test.mjs fork-integration/boot-service/*.test.mjs

      - run: node --test managed-desktop/*.test.mjs managed-cloud/*.test.mjs

      - run: node --test src-tauri/src/managed_desktop.contract.test.mjs

      - run: npm run typecheck:managed-acceptance

      - run: npm run test:managed-acceptance

      - run: npm run test:mobile:ios-preparation

      - run: npm run test:mobile:experience

      - run: node --test mobile-experience/activation/*.test.mjs apps/mobile/root-shell/*.test.mjs

      - run: npm run test:mobile:catalog

      - run: node --test apps/mobile/babel-owned-hosted-origin.test.cjs

      - run: npx --no-install vitest run --config managed-validation/mobile-cloud-links.vitest.config.ts

      - run: npm run test:mobile:resolution

      - run: npm run verify:mobile:consumers

      - run: npm run test:shared-runtime

      - run: npm run verify:shared-runtime

      - run: npm run bundle:shared-runtime:ios

      - run: npm run build

  rust:
    name: rust (cargo check + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Tauri's wry crate pulls GTK/WebKitGTK on Linux. Install them before
      # any cargo invocation touches the dep graph.
      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            apps/relay

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: relay cargo check
        working-directory: apps/relay
        run: cargo check --locked

      - name: relay cargo test
        working-directory: apps/relay
        run: cargo test --locked

  # The release builds for Windows too, but the Linux job above can't catch
  # Windows-only compile breaks (e.g. platform-specific libc APIs). A cheap
  # cargo check on Windows catches them at PR time instead of at release.
  windows-check:
    name: windows (cargo check)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (windows)
        working-directory: src-tauri
        run: cargo check --locked

  host-core-prototype:
    name: host core (isolated process smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/host-core-prototype
      - name: build without desktop dependencies
        run: cargo build --locked --manifest-path experiments/host-core-prototype/Cargo.toml
      - name: verify process ownership and reconnect
        run: python3 experiments/host-core-prototype/smoke.py

  ios-validation-guards:
    name: iOS acceptance portable guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python3 -m unittest discover -s managed-validation/ios-ui -p controller_test.py

  managed-cloud-clients:
    name: cloud clients (pinned source + types + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.12.1"
      - run: npm install --global pnpm@12.14.0 --ignore-scripts
      - name: prepare pinned Blackcrab clients
        id: clients
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createWriteStream } from 'node:fs';
          import path from 'node:path';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          import { UPSTREAM } from './managed-host/artifact.mjs';
          import { prepareCloudClients } from './managed-cloud/clients.mjs';
          const archive = path.join(process.env.RUNNER_TEMP, 'blackcrab-clients-upstream.tar.gz');
          const response = await fetch(`https://api.github.com/repos/BonJenn/t3code/tarball/${UPSTREAM.commit}`);
          if (!response.ok || !response.body) throw new Error(`Source download failed: ${response.status}`);
          await pipeline(Readable.fromWeb(response.body), createWriteStream(archive, { flags: 'wx' }));
          const prepared = await prepareCloudClients({ archive, cacheDir: path.join(process.env.RUNNER_TEMP, 'blackcrab-clients') });
          await fs.appendFile(process.env.GITHUB_OUTPUT, `source=${prepared.source}\n`);
          NODE
      - name: install pinned dependencies
        working-directory: ${{ steps.clients.outputs.source }}
        run: pnpm --filter '@t3tools/desktop...' --filter '@t3tools/web...' --filter . install --frozen-lockfile --ignore-scripts
      - name: typecheck complete desktop source
        working-directory: ${{ steps.clients.outputs.source }}/apps/desktop
        run: node ../../node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit
      - name: test owned cloud and original account/link behavior
        working-directory: ${{ steps.clients.outputs.source }}
        run: node --no-experimental-webstorage node_modules/vite-plus/bin/vp test run --config blackcrab-cloud-test.config.ts

  managed-hosted-web:
    name: hosted web (${{ matrix.mode }}, pinned build + types + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [single, channels]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.12.1"
      - run: npm install --global pnpm@12.14.0 --ignore-scripts
      - name: build original hosted app with owned fixture settings
        id: hosted
        env:
          HOSTED_TEST_MODE: ${{ matrix.mode }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createWriteStream } from 'node:fs';
          import path from 'node:path';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          import { execFileSync } from 'node:child_process';
          import { UPSTREAM } from './managed-host/artifact.mjs';
          import { buildHostedWeb } from './managed-cloud/hosted-build.mjs';
          const archive = path.join(process.env.RUNNER_TEMP, 'blackcrab-hosted-upstream.tar.gz');
          const response = await fetch(`https://api.github.com/repos/BonJenn/t3code/tarball/${UPSTREAM.commit}`);
          if (!response.ok || !response.body) throw new Error(`Source download failed: ${response.status}`);
          await pipeline(Readable.fromWeb(response.body), createWriteStream(archive, { flags: 'wx' }));
          const environment = {
            BLACKCRAB_CLERK_PUBLISHABLE_KEY: 'pk_test_Y2xlcmsuYmxhY2tjcmFiLmV4YW1wbGUk',
            BLACKCRAB_CLERK_JWT_TEMPLATE: 'blackcrab-relay',
            BLACKCRAB_RELAY_URL: 'https://relay.blackcrab.example',
            BLACKCRAB_HOSTED_APP_URL: 'https://app.blackcrab.example',
            BLACKCRAB_CLERK_CLI_OAUTH_CLIENT_ID: 'blackcrab-cli-fixture',
            BLACKCRAB_APPLE_TEAM_ID: 'BC12345678',
            BLACKCRAB_DESKTOP_DOWNLOAD_URL: 'https://blackcrab.example/download',
            BLACKCRAB_PRIVACY_POLICY_URL: 'https://blackcrab.example/privacy',
            ...(process.env.HOSTED_TEST_MODE === 'channels' ? {
              BLACKCRAB_HOSTED_LATEST_URL: 'https://latest.blackcrab.example',
              BLACKCRAB_HOSTED_NIGHTLY_URL: 'https://nightly.blackcrab.example',
              BLACKCRAB_HOSTED_APP_CHANNEL: 'latest',
            } : {}),
          };
          const result = await buildHostedWeb({ archive,
            cacheDir: path.join(process.env.RUNNER_TEMP, 'blackcrab-hosted-cache'),
            output: path.join(process.env.RUNNER_TEMP, 'blackcrab-hosted-artifact'),
            node: process.execPath, pnpm: execFileSync('which', ['pnpm'], { encoding: 'utf8' }).trim(), environment });
          await fs.appendFile(process.env.GITHUB_OUTPUT, `source=${result.source}\n`);
          NODE
      - name: typecheck complete hosted web source
        working-directory: ${{ steps.hosted.outputs.source }}/apps/web
        run: node ../../node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit
      - name: test original pairing and owned deployment routing
        working-directory: ${{ steps.hosted.outputs.source }}
        run: node --no-experimental-webstorage node_modules/vite-plus/bin/vp test run --config blackcrab-hosted-test.config.ts

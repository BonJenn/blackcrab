name: managed Linux host

on:
  pull_request:
    paths:
      - managed-host/**
      - managed-desktop/**
      - managed-cloud/client-config.mjs
      - src/workspaceStartup.ts
      - src/App.tsx
      - src-tauri/src/managed_host.rs
      - src-tauri/src/managed_service*.rs
      - src-tauri/src/managed_payload.rs
      - src-tauri/src/managed_desktop*.rs
      - src-tauri/src/managed_native_entry.rs
      - src-tauri/src/managed_launcher.rs
      - src-tauri/tauri.conf.json
      - scripts/prepare-service-issuer*
      - scripts/managed-native-resources*
      - scripts/build-linux-host-ci.mjs
      - scripts/build-linux-installers-ci.mjs
      - scripts/build-portable-desktop-ci.mjs
      - scripts/tauri-build.mjs
      - scripts/test-linux-service-manager.py
      - scripts/test-linux-installed-workspace.py
      - scripts/test-linux-installed-workspace.test.py
      - .github/workflows/managed-linux-host.yml
  workflow_dispatch:
  # The release workflow runs this same job and publishes what it accepted.
  # Only a release signs updater artifacts; a pull request never sees the key.
  workflow_call:
    inputs:
      sign_updates:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: managed-linux-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-package:
    name: Linux installers and real workspace
    # Build on the oldest supported WebKitGTK 4.1 baseline to avoid requiring
    # Ubuntu24's newer glibc in every downloaded Linux installer.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # Public Connect settings, so what is accepted here is what a release ships.
    env:
      BLACKCRAB_CLERK_PUBLISHABLE_KEY: ${{ vars.BLACKCRAB_CLERK_PUBLISHABLE_KEY }}
      BLACKCRAB_CLERK_JWT_TEMPLATE: ${{ vars.BLACKCRAB_CLERK_JWT_TEMPLATE }}
      BLACKCRAB_RELAY_URL: ${{ vars.BLACKCRAB_RELAY_URL }}
      BLACKCRAB_HOSTED_APP_URL: ${{ vars.BLACKCRAB_HOSTED_APP_URL }}
      BLACKCRAB_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.BLACKCRAB_CLERK_CLI_OAUTH_CLIENT_ID }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libfuse2 libnss3 libasound2 libgbm1 unzip webkit2gtk-driver xvfb xauth openbox xdotool imagemagick
      - run: npm ci --ignore-scripts
      - run: npm install --global pnpm@12.14.0 --ignore-scripts
      - name: Test installer input and isolated-account refusal guards
        run: python3 scripts/test-linux-installed-workspace.test.py
      - name: Build real pinned host, archive and native helper
        run: node scripts/build-linux-host-ci.mjs --root "${{ runner.temp }}/linux-host-build" --pnpm "$(command -v pnpm)"
      - name: Exercise actual package through isolated systemd and native attachment
        run: python3 scripts/test-linux-service-manager.py --actual-host
      - name: Compile the actual Linux Electron workspace
        run: node scripts/build-portable-desktop-ci.mjs --root "${{ runner.temp }}/linux-desktop-build" --pnpm "$(npm root -g)/pnpm/bin/pnpm.mjs"
      - name: Build and verify the normal deb and AppImage installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign_updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign_updates && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node scripts/build-linux-installers-ci.mjs --root "${{ runner.temp }}/linux-installers" --host "${{ runner.temp }}/linux-host-build/artifact" --desktop "${{ runner.temp }}/linux-desktop-build/artifact" ${{ inputs.sign_updates && '--sign-updates' || '' }}
      - name: Install the official Tauri WebDriver
        run: cargo install tauri-driver --locked --version 2.1.0
      # The published 0.4.4 package, by digest. It is installed and opened first
      # so that the candidate upgrades a real earlier installation.
      - name: Download the released 0.4.4 package to upgrade from
        run: |
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/Blackcrab_0.4.4_amd64.deb" \
            https://github.com/BonJenn/blackcrab/releases/download/v0.4.4/Blackcrab_0.4.4_amd64.deb
          echo "3109e99cbe53ea5ab2f198d9dbc18b06f411b4b1921eeb0354a08ee326e5e6b5  $RUNNER_TEMP/Blackcrab_0.4.4_amd64.deb" | sha256sum --check
      - name: Upgrade a 0.4.4 installation, then quit and reopen from AppImage with the same service
        run: python3 scripts/test-linux-installed-workspace.py --report "$BLACKCRAB_LINUX_PACKAGE_REPORT" --upgrade-from "$RUNNER_TEMP/Blackcrab_0.4.4_amd64.deb"
      # Only installers that passed everything above. A release attaches these
      # exact files; from a pull request they are a short-lived test download.
      - uses: actions/upload-artifact@v6
        with:
          name: linux-installers
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-host-package-build
          path: |
            ${{ runner.temp }}/linux-host-build/result.json
            ${{ runner.temp }}/linux-host-build/cache/blackcrab-managed-build-*/*.log
            ${{ runner.temp }}/linux-desktop-build/result.json
            ${{ runner.temp }}/linux-desktop-build/cache/blackcrab-desktop-build-*/logs/*.log
            ${{ runner.temp }}/linux-installers/result.json
            ${{ runner.temp }}/linux-installers/logs/*.log
            ${{ runner.temp }}/linux-installers/ui-acceptance/result.json
            ${{ runner.temp }}/linux-installers/ui-acceptance/seed-result.json
            ${{ runner.temp }}/linux-installers/ui-acceptance/cleanup.json
            ${{ runner.temp }}/linux-installers/ui-acceptance/crash.txt
            ${{ runner.temp }}/linux-installers/ui-acceptance/failure-screen.png
            ${{ runner.temp }}/linux-installers/ui-acceptance/*-workspace.png
          if-no-files-found: warn

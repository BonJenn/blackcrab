name: managed Windows host

on:
  pull_request:
    paths:
      - managed-host/**
      - fork-integration/boot-service/**
      - managed-cloud/client-config.mjs
      - scripts/build-windows-host-ci.mjs
      - scripts/managed-native-resources.mjs
      - scripts/prepare-service-issuer.mjs
      - src-tauri/src/service_issuer_main.rs
      - src-tauri/src/managed_service*.rs
      - src-tauri/src/managed_host.rs
      - src-tauri/src/managed_payload*.rs
      - src-tauri/src/managed_private_windows.rs
      - src-tauri/src/managed_workspace_windows.rs
      - src-tauri/src/managed_desktop*.rs
      - src-tauri/src/managed_native_entry.rs
      - src-tauri/src/managed_launcher.rs
      - managed-desktop/**
      - scripts/build-portable-desktop-ci.mjs
      - scripts/build-windows-installers-ci.mjs
      - scripts/probe-workspace-page.mjs
      - scripts/test-windows-installed-workspace.ps1
      - src/workspaceStartup.ts
      - src/App.tsx
      - scripts/tauri-build.mjs
      - src-tauri/tauri.conf.json
      - src-tauri/src/managed_spawn_windows.rs
      - src-tauri/src/lib.rs
      - .github/workflows/managed-windows-host.yml
  workflow_dispatch:
  # The release workflow runs this same job and publishes what it accepted.
  # Only a release signs updater artifacts; a pull request never sees the key.
  workflow_call:
    inputs:
      sign_updates:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: managed-windows-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-payload:
    name: Windows service payload and helper
    runs-on: windows-2022
    timeout-minutes: 120
    # Public Connect settings, so what is accepted here is what a release ships.
    env:
      BLACKCRAB_CLERK_PUBLISHABLE_KEY: ${{ vars.BLACKCRAB_CLERK_PUBLISHABLE_KEY }}
      BLACKCRAB_CLERK_JWT_TEMPLATE: ${{ vars.BLACKCRAB_CLERK_JWT_TEMPLATE }}
      BLACKCRAB_RELAY_URL: ${{ vars.BLACKCRAB_RELAY_URL }}
      BLACKCRAB_HOSTED_APP_URL: ${{ vars.BLACKCRAB_HOSTED_APP_URL }}
      BLACKCRAB_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.BLACKCRAB_CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      # The producer checks every reviewed source file against its recorded
      # hash. Those hashes are of the committed bytes, so the checkout must
      # not rewrite line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      # The producer starts pnpm directly, so it needs the standalone
      # executable, not the script npm would install.
      - run: npm install --global @pnpm/exe@12.14.0 --ignore-scripts
      - name: Build the real pinned Windows service payload, its archive and the native helper
        shell: bash
        run: |
          PNPM="$(find "$(npm root -g)" -name pnpm.exe | head -1)"
          test -n "$PNPM"
          node scripts/build-windows-host-ci.mjs --root "$RUNNER_TEMP/windows-host-build" --pnpm "$(cygpath -w "$PNPM")"
      # The real workspace too, so Root's owner can open it against the service.
      # Its build wants pnpm as a script. Installed apart from the standalone
      # executable above: globally the two claim the same command names.
      - run: npm install --prefix "${{ runner.temp }}/pnpm-script" pnpm@12.14.0 --ignore-scripts
      - name: Compile and verify the actual Windows workspace
        run: node scripts/build-portable-desktop-ci.mjs --root "${{ runner.temp }}/portable-workspace-build" --pnpm "${{ runner.temp }}/pnpm-script/node_modules/pnpm/bin/pnpm.mjs"
      # Root itself, compiled against that payload and helper, sets the service
      # up in a fresh private directory, registers the real scheduled task,
      # attaches to the running service, stops, starts and restarts it, and
      # removes the task again. No agent prompt is sent.
      - name: Install, start, attach to, stop and remove the real service through Task Scheduler
        working-directory: src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          BLACKCRAB_BOOT_EVIDENCE: ${{ runner.temp }}/windows-host-build
          BLACKCRAB_TEST_WORKSPACE_OUTPUT: ${{ runner.temp }}/windows-host-build/workspace-output.raw
          BLACKCRAB_TEST_WORKSPACE_DEBUG_PORT: '9339'
        # Hashing is optimized even in this test build. Unoptimized, one payload
        # verification takes about seven seconds against half a second in a
        # release build, and the launch's eight-second pairing limit is missed.
        run: cargo test --locked --lib --config "profile.dev.package.sha2.opt-level=3" --config "profile.test.package.sha2.opt-level=3" managed_host::windows_service_tests::actual_packaged_windows_service_lifecycle -- --exact --ignored --nocapture
      # A person's existing installation: the published 0.4.4 installer, by
      # digest, installed and opened once so that it sets up its service. The
      # candidate is then installed and opened over it.
      - name: Install and open the released 0.4.4 to upgrade from
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'Blackcrab_0.4.4_x64-setup.exe'
          curl.exe --fail --location --silent --show-error --retry 3 --output $setup https://github.com/BonJenn/blackcrab/releases/download/v0.4.4/Blackcrab_0.4.4_x64-setup.exe
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'windows-upgrade') | Out-Null
          ./scripts/test-windows-installed-workspace.ps1 -Seed $setup -SeedRecord (Join-Path $env:RUNNER_TEMP 'windows-upgrade\seed.json')
      # The normal launcher with both real payloads, as an NSIS installer,
      # installed silently for this user into a directory of this run.
      - name: Build, install and verify the normal Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign_updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign_updates && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node scripts/build-windows-installers-ci.mjs --root "${{ runner.temp }}/windows-installers" --host "$env:BLACKCRAB_WINDOWS_HOST_ARTIFACT" --desktop "$env:BLACKCRAB_NATIVE_PACKAGE_ROOT" ${{ inputs.sign_updates && '--sign-updates' || '' }}
      # The installed launcher, started as a person starts it: it sets up and
      # starts the service and opens the workspace by itself, twice.
      - name: Open the installed app over the 0.4.4 installation, quit and reopen with the same service
        run: ./scripts/test-windows-installed-workspace.ps1 -Report "$env:BLACKCRAB_WINDOWS_PACKAGE_REPORT" -SeedRecord (Join-Path $env:RUNNER_TEMP 'windows-upgrade\seed.json')
      # Only an installer that passed everything above. A release attaches this
      # exact file; from a pull request it is a short-lived test download.
      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-host-build
          path: |
            ${{ runner.temp }}/windows-host-build/result.json
            ${{ runner.temp }}/windows-host-build/workspace-attached*.png
            ${{ runner.temp }}/windows-host-build/workspace-logs/*
            ${{ runner.temp }}/windows-installers/result.json
            ${{ runner.temp }}/windows-installers/logs/*.log
            ${{ runner.temp }}/windows-installers/ui-acceptance/*
            ${{ runner.temp }}/windows-upgrade/seed-acceptance/*
            ${{ runner.temp }}/windows-host-build/cache/blackcrab-managed-build-*/*.log
          if-no-files-found: warn

[package]
name = "blackcrab"
version = "0.3.0"
description = "A local desktop GUI for Claude Code sessions."
authors = ["Jonathan Benn"]
license = "Apache-2.0"
repository = "https://github.com/BonJenn/blackcrab"
homepage = "https://github.com/BonJenn/blackcrab"
readme = "../README.md"
edition = "2021"

[lib]
name = "blackcrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
url = "2"
tauri-plugin-notification = "2.3.3"
portable-pty = "0.9.0"
tauri-plugin-process = "2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
crypto_secretbox = "0.1"
base64 = "0.22"
getrandom = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# Used only by the relay-client integration test to spin up a real relay.
blackcrab-relay = { path = "../apps/relay" }

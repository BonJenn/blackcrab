[package]
name = "blackcrab"
version = "0.4.2"
description = "A desktop workspace for coding agents, projects and remote access."
authors = ["Jonathan Benn"]
license = "Apache-2.0"
repository = "https://github.com/BonJenn/blackcrab"
homepage = "https://github.com/BonJenn/blackcrab"
readme = "../README.md"
edition = "2021"
default-run = "blackcrab"

[features]
managed-bridge-qa = []
managed-entry-qa = []
service-issuer = []

[[bin]]
name = "blackcrab-service-issuer"
path = "src/service_issuer_main.rs"
required-features = ["service-issuer"]

[lib]
name = "blackcrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
url = "2"
tauri-plugin-notification = "2.3.3"
portable-pty = "0.9.0"
tauri-plugin-process = "2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
crypto_secretbox = "0.1"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10.9"
tar = "=0.4.45"
flate2 = "=1.1.9"
hmac = "0.12.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.39", default-features = false, features = ["std", "ring", "tls12"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# Used only by the relay-client integration test to spin up a real relay.
blackcrab-relay = { path = "../apps/relay" }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.8.0"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
